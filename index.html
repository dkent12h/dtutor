<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디지털 포용교육 코스웨어 (전현직·사례 분석·수강생용)</title>
<style>
/* Layout: fixed TOC rail on the left, one lesson card in the reading column, sticky action bar on top. */
:root{
  --paper:#FBF7F1; --card:#FFFFFF; --ink:#2E2A26; --ink-soft:#6B6258; --line:#E7DED1;
  --accent:#E8832B; --accent-soft:#FDF0E2; --accent-ink:#A9560F;
  --ok:#2F7D5D; --ok-soft:#E6F2EC;
  --rail:#F5EDE2;
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1916; --card:#242019; --ink:#F0E9DF; --ink-soft:#AFA496; --line:#3A332A;
    --accent:#F2994A; --accent-soft:#3A2A19; --accent-ink:#F7B877;
    --ok:#6FC79F; --ok-soft:#1F3129; --rail:#201C17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1916; --card:#242019; --ink:#F0E9DF; --ink-soft:#AFA496; --line:#3A332A;
  --accent:#F2994A; --accent-soft:#3A2A19; --accent-ink:#F7B877;
  --ok:#6FC79F; --ok-soft:#1F3129; --rail:#201C17;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font-family:inherit}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;
  padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:var(--accent)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn.ghost{color:var(--ink-soft)}
.tbtn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#menuBtn{display:none}
.progwrap{height:3px;background:var(--line)}
.progbar{height:100%;width:0;background:var(--accent);transition:width .25s ease}

/* ---- shell ---- */
.shell{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:286px minmax(0,1fr);gap:28px;
  padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toc{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 100px);overflow-y:auto;
  background:var(--rail);border:1px solid var(--line);border-radius:14px;padding:14px 10px}
.toc h2{margin:0 0 4px;padding:0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.toc .grp{margin-top:12px;padding:0 8px;font-size:12.5px;font-weight:700;color:var(--accent-ink);letter-spacing:-.01em}
.toc button{display:flex;gap:7px;align-items:baseline;width:100%;text-align:left;border:0;background:none;color:var(--ink);
  font-size:13.2px;line-height:1.45;padding:6px 8px;border-radius:8px;cursor:pointer}
.toc button:hover{background:var(--accent-soft)}
.toc button.cur{background:var(--accent);color:#fff;font-weight:600}
.toc button .no{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-width:18px}
.toc button.cur .no{color:#fff}
.toc button .tx{min-width:0}
.toc .mk{margin-left:auto;flex:none;white-space:nowrap;font-size:10.5px;padding:1px 5px;border-radius:5px;background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.toc button.cur .mk{background:rgba(255,255,255,.25);color:#fff}
.toc .mk.done{background:var(--ok-soft);color:var(--ok)}

/* ---- page card ---- */
.page{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 30px 34px}
.eyebrow{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--accent-ink);
  background:var(--accent-soft);border-radius:999px;padding:4px 11px;margin-bottom:14px}
h1.ttl{margin:0 0 20px;font-size:27px;line-height:1.3;letter-spacing:-.02em;text-wrap:balance;font-weight:700}
.page.chasi{background:linear-gradient(160deg,var(--accent-soft),var(--card) 62%)}
.blocks{display:flex;flex-direction:column;gap:18px}

table.t{width:100%;border-collapse:collapse;font-size:15px}
.scroller{overflow-x:auto}
table.t th{background:var(--accent);color:#fff;font-weight:700;padding:11px 12px;text-align:center;font-size:14.5px}
table.t td{border:1px solid var(--line);padding:10px 12px;vertical-align:top}
table.t tbody tr:nth-child(odd) td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
table.t td.first{text-align:center;font-weight:600;white-space:pre-line}
table.t td ul{margin:0;padding-left:17px}
table.t td li{margin:2px 0}

ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
ol.steps li{display:flex;gap:10px;font-size:15.5px}
ol.steps .bullet{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:9px}
ul.dash{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:15.5px}
.tip{display:flex;gap:9px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;
  padding:12px 14px;font-size:14.5px;color:var(--ink)}
.tip b{color:var(--accent-ink);flex:none}
.goal{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.goal .lab,.qlist .lab,.ws .lab,.lt .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--accent-ink);margin-bottom:8px}
.goal p{margin:0;font-size:16px}
.qlist ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:16px}
.prompt{font-size:17px;font-weight:600;line-height:1.5}

/* ---- inputs ---- */
.ws table{width:100%;border-collapse:collapse}
.ws th{background:var(--accent);color:#fff;padding:9px 10px;font-size:13.5px;font-weight:700;text-align:center}
.ws td{border:1px solid var(--line);padding:6px;vertical-align:top}
.cellwrap{display:flex;flex-direction:column;gap:6px}
.cellwrap .num{font-size:12px;color:var(--ink-soft);font-weight:700}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);
  font-family:inherit;font-size:14.5px;line-height:1.6;padding:9px 10px;resize:vertical}
textarea::placeholder{color:var(--ink-soft);opacity:.65}
.lt textarea{min-height:110px}
.checks{display:flex;flex-direction:column;gap:2px}
.checks label{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;cursor:pointer;font-size:15px;background:var(--card)}
.checks label:has(input:checked){background:var(--ok-soft);border-color:var(--ok)}
.checks input{margin-top:4px;width:17px;height:17px;accent-color:var(--ok);flex:none}
/* activity blocks */
.act{border:1px solid var(--accent);border-radius:12px;padding:15px 16px;background:color-mix(in srgb,var(--accent-soft) 38%,transparent)}
.act .lab{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--accent-ink);margin-bottom:10px}
.act .q{margin:0 0 10px;font-size:15.5px;font-weight:600;line-height:1.5}
.fgrid{display:flex;flex-direction:column;gap:11px}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:start}
.frow .fk{font-size:14px;font-weight:600;color:var(--ink-soft);padding-top:9px}
.quiz .revealbtn{margin-top:10px;border:1px solid var(--line);background:var(--card);color:var(--accent-ink);
  border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.quiz .revealbtn:hover{border-color:var(--accent)}
.quiz .model{margin-top:9px;padding:11px 13px;border-radius:9px;background:var(--ok-soft);color:var(--ink);
  font-size:14.5px;border-left:3px solid var(--ok)}
.share{border-style:dashed}
.srow{display:flex;gap:8px;flex-wrap:wrap}
.srow input[type=text]{flex:1;min-width:180px}
.sbtn{border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;
  padding:10px 16px;cursor:pointer;white-space:nowrap}
.sbtn:disabled{background:var(--ok);cursor:default}
.smsg{font-size:13px;margin-top:7px;color:var(--ink-soft);min-height:18px}
.smsg.ok{color:var(--ok);font-weight:600}
.smsg.warn{color:#C1452B;font-weight:600}
.talkq{margin:2px 0 10px;padding:10px 14px;border-radius:10px;background:var(--ok-soft);border-left:3px solid var(--ok);font-size:17px;line-height:1.5}
.talkq b{color:var(--ok)}
.sendrow{margin-top:12px}
.sbtn.vbtn:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed}
.talkbox .q{font-size:19px;margin:0}
.snote{margin:8px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.55}
.savemark{font-size:12px;color:var(--ok);font-weight:600;white-space:nowrap}

/* closing page */
.finish{display:flex;flex-direction:column;gap:14px}
.fsum{border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center;background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.fsum .big{font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.fsum .sub{font-size:14px;color:var(--ink-soft);margin-top:2px}
.fp{margin:0;font-size:15px;line-height:1.6}
.bigbtn{width:100%;border:0;border-radius:12px;padding:16px;font-size:16.5px;font-weight:700;cursor:pointer;
  background:var(--accent);color:#fff}
.bigbtn:hover{filter:brightness(1.06)}
.bigbtn.danger{background:transparent;border:1px solid #C1452B;color:#C1452B}
.bigbtn.danger:hover{background:#C1452B;color:#fff;filter:none}
.fhr{border:0;border-top:1px dashed var(--line);margin:8px 0 2px;width:100%}
.fnote{margin:6px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.6}


.exbtn{margin-top:10px;border:1px solid #3a8f6a;background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
.exbtn:hover{filter:brightness(1.05)}
.exbox{margin-top:9px;padding:12px 15px;border-radius:10px;background:var(--ok-soft);border-left:4px solid var(--ok);font-size:16px;line-height:1.65;white-space:pre-line}
.exbox .exk{font-weight:700;color:var(--ok)}
.exbox table{width:100%;border-collapse:collapse;font-size:15px;white-space:pre-line}
.exbox th,.exbox td{border:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:left}
.exbox th{background:var(--card)}
.audbadge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#3a8f6a;color:#fff;white-space:nowrap}
/* ---- figures (screenshots from the lesson) ---- */
.figs{margin:2px 0}
.figrow{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.figrow img{display:block;max-height:440px;max-width:100%;width:auto;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:zoom-in}
.figcap{margin:8px 0 0;font-size:15px;color:var(--ink-soft)}
/* ---- slide picture ---- */
.slidefig{margin:0 0 4px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:zoom-in;position:relative}
.slidefig{display:flex;justify-content:center}
.slidefig img{display:block;width:auto;max-width:100%;height:auto;max-height:calc(100vh - 200px)}
.actcue{margin:2px 0 -6px;font-size:15px;font-weight:700;color:var(--accent-ink)}
.slidefig .zoomhint{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;padding:4px 10px;border-radius:999px}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:16px}
.lightbox img{max-width:96vw;max-height:94vh;border-radius:8px;background:#fff}
/* ---- word cloud overlay (함께 보기) ---- */
.wc{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:#17140F;color:#F6EFE4}
.wc[hidden]{display:none}
.wcbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:#211C15;border-bottom:1px solid #3A3228}
.wcbar select{flex:1;min-width:260px;max-width:760px;background:#17140F;color:#F6EFE4;border:1px solid #3A3228;border-radius:8px;padding:10px 12px;font-size:16px;font-family:inherit}
.wcbar button{border:1px solid #3A3228;background:#17140F;color:#F6EFE4;border-radius:8px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.wcbar button:hover{border-color:#E8832B}
.wcbar button.back{background:#E8832B;border-color:#E8832B;color:#fff;font-size:16px;padding:10px 18px}
.wcbar button.rst{border-color:#8a3b2c;color:#E98A7A}
.wcbar button.rst:hover{border-color:#E98A7A;background:#2b1814}
.wcbar button.nxt{background:#2f6f55;border-color:#2f6f55;color:#fff}
.wcbar .cnt{font-size:15px;color:#A99C8A;font-variant-numeric:tabular-nums}
.wcbar .sp{flex:1}
.wcbar label{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:#6FC79F}
.wctalk{padding:10px 20px;background:#2a2218;border-bottom:1px solid #3A3228;font-size:20px;font-weight:700;color:#F6EFE4}
.wctalk b{color:#6FC79F}
.wcbody{flex:1;display:flex;min-height:0}
.wcmain{flex:0 0 36%;position:relative;overflow:hidden}
.wccloud{position:absolute;inset:0}
.wccloud span{position:absolute;white-space:nowrap;font-weight:800;letter-spacing:-.02em;transform:translate(-50%,-50%);transition:opacity .4s ease}
.wcempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#A99C8A;font-size:20px;text-align:center;padding:24px}
.wcempty[hidden]{display:none}
.wcsplit{flex:0 0 14px;background:#2a2218;cursor:col-resize;position:relative;touch-action:none;border-left:1px solid #3A3228;border-right:1px solid #3A3228}
.wcsplit::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:48px;transform:translate(-50%,-50%);border-radius:3px;background:#A99C8A}
.wcsplit:hover,.wcsplit.drag{background:#3A3228}
.wcsplit:hover::after,.wcsplit.drag::after{background:#E8832B}
.wclist{--fs:26px;flex:1;min-width:0;background:#211C15;overflow-y:auto;padding:10px 28px}
.wclist[hidden]{display:none}
.wclist span{display:block;border-bottom:1px solid #3A3228;padding:12px 2px;font-size:var(--fs);line-height:1.5;font-weight:600}
@media (max-width:900px){.wcbody{flex-direction:column}.wcmain{flex:0 0 32%}.wcsplit{flex:0 0 14px;cursor:row-resize;border:0;border-top:1px solid #3A3228;border-bottom:1px solid #3A3228}.wcsplit::after{width:48px;height:4px}}
.wcerr{color:#E98A7A;font-size:14px}

/* ---- pager ---- */
.pager{display:flex;align-items:center;gap:12px;margin-top:20px}
.pager .count{flex:1;text-align:center;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 18px;
  font-size:14.5px;font-weight:600;cursor:pointer}
.pbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-ink)}
.pbtn:disabled{opacity:.4;cursor:default}
.note{margin-top:18px;font-size:12.5px;color:var(--ink-soft);display:flex;gap:7px;align-items:flex-start}

/* ---- modal / toast ---- */
.scrim{position:fixed;inset:0;background:rgba(20,16,12,.52);display:flex;align-items:center;justify-content:center;
  z-index:60;padding:20px}
.modal{background:var(--card);border-radius:16px;max-width:420px;width:100%;padding:24px;border:1px solid var(--line)}
.modal h3{margin:0 0 10px;font-size:19px}
.modal p{margin:0 0 18px;font-size:14.5px;color:var(--ink-soft)}
.modal .row{display:flex;gap:10px;justify-content:flex-end}
.danger{background:#C1452B;border-color:#C1452B;color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-size:14px;z-index:70}

/* ---- print ---- */
#printdoc{display:none}
@media print{
  .topbar,.toc,.pager,.note,.scrim,.toast{display:none!important}
  #app{display:none!important}
  #printdoc{display:block!important}
  body{background:#fff;color:#000;font-size:11pt}
  #printdoc h1{font-size:19pt;margin:0 0 2pt}
  #printdoc .meta{font-size:9.5pt;color:#555;margin-bottom:14pt;border-bottom:1px solid #999;padding-bottom:8pt}
  #printdoc section{margin-bottom:13pt;break-inside:avoid}
  #printdoc .grp{font-size:8.5pt;letter-spacing:.06em;color:#8a5a1d;font-weight:700}
  #printdoc h2{font-size:12.5pt;margin:1pt 0 5pt;border-bottom:1px solid #ddd;padding-bottom:3pt}
  #printdoc .f{margin:0 0 7pt}
  #printdoc .fl{font-size:9pt;color:#666;font-weight:700}
  #printdoc .fv{white-space:pre-wrap;border-left:2px solid #e2a768;padding-left:7pt;margin-top:2pt}
  #printdoc .empty{color:#999;font-style:italic}
  @page{margin:16mm 14mm}
}

/* ---- desktop layout (PC 화면 기준: 목차 항상 표시, 큰 글씨) ---- */
body{min-width:1100px;font-size:18px}
.topbar-in,.shell{max-width:1640px}
.shell{grid-template-columns:330px minmax(0,1fr);gap:32px}
.brand b{font-size:18px}
.brand span{font-size:13px}
.tbtn{font-size:15px;padding:9px 16px}
.toc{top:84px;max-height:calc(100vh - 108px)}
.toc .grp{font-size:14px}
.toc button{font-size:15px}
.toc button .no{font-size:12px}
.page{padding:36px 44px 40px}
h1.ttl{font-size:34px}
table.t,.ws table{font-size:18px}
.goal p,.qlist ol{font-size:19px}
.prompt{font-size:20px}
.frow{grid-template-columns:200px minmax(0,1fr)}
.frow .fk{font-size:16px}
textarea,input[type=text]{font-size:17px}
.sbtn{font-size:16px}
.smsg,.pager .count{font-size:15px}
.fp{font-size:17px}
ol.steps li,ul.dash{font-size:19px}
ol.steps .bullet{margin-top:11px}
.tip{font-size:17px}
.checks label{font-size:17px}
table.t th{font-size:17px}
/* 목차: 평소에는 숨기고, 목차 버튼을 누르면 펼침 */
#menuBtn{display:inline-block}
.shell{grid-template-columns:minmax(0,1fr);max-width:1180px}
.toc{display:none;position:fixed;top:84px;left:16px;width:360px;max-height:calc(100vh - 108px);z-index:30;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.toc.open{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

(function(){

  function close(){ lb.remove(); document.removeEventListener('keydown', onk); }
  function onk(e){ if(e.key==='Escape') close(); }
  lb.addEventListener('click', close); document.addEventListener('keydown', onk);
  document.body.appendChild(lb);
}

  try{ var raw = localStorage.getItem(KEY); if(raw){ var o = JSON.parse(raw);

    if(mk){ mk.hidden = false; clearTimeout(markTimer); markTimer = setTimeout(function(){ mk.hidden = true; }, 1600); }

}
function wipe(){

  return {items:items, pages:pages};
}

var WC_STOP = ['그리고','하지만','그래서','정말','조금','많이','하는','하기','해서','있는','있다','없다','같은','위해','통해','대한','에서','으로','이다','한다'];
var WC_PART = ['으로서','에서는','에게는','이라는','라는','으로','에서','에게','부터','까지','처럼','보다','마다','이나','거나','과의','와의','들의','은','는','이','가','을','를','의','에','도','와','과','로','만','요'];
function wcWords(rows){
  var map={};
  rows.forEach(function(r){
    var raw=String(r.answer||'').trim(), tokens=raw.split(/\s+/).filter(Boolean);
    if(tokens.length<=3 && raw.replace(/\s/g,'').length<=12){ if(raw) map[raw]=(map[raw]||0)+1; return; }
    raw.split(/[\s,./·|()\[\]"'’”]+/).forEach(function(w){
      w=w.trim(); if(!w) return;
      for(var i=0;i<WC_PART.length;i++){ var q=WC_PART[i]; if(w.length>q.length+1 && w.slice(-q.length)===q){ w=w.slice(0,-q.length); break; } }
      if(w.length>1 && WC_STOP.indexOf(w)===-1) map[w]=(map[w]||0)+1;
    });
  });
  return Object.keys(map).map(function(k){ return {w:k,n:map[k]}; }).sort(function(a,b){ return b.n-a.n; }).slice(0,60);
}
function wcDraw(host, words){
  host.innerHTML='';
  if(!words.length) return;
  var W=host.clientWidth, H=host.clientHeight;
  var max=words[0].n, min=words[words.length-1].n;
  var pal=['#E8832B','#5BA8C9','#8FBF6A','#D9657A','#F6EFE4'], placed=[];
  words.forEach(function(it,idx){
    var t = max===min ? 1 : (it.n-min)/(max-min);
    var size=Math.round(Math.min(W,H)*0.05 + t*Math.min(W,H)*0.14);
    size=Math.max(18,Math.min(size,170));
    var sp=document.createElement('span'); sp.textContent=it.w; sp.title=it.n+'회';
    sp.style.fontSize=size+'px'; sp.style.color=pal[idx%pal.length]; sp.style.opacity='0';
    host.appendChild(sp);
    var w=sp.offsetWidth, h=sp.offsetHeight, cx=W/2, cy=H/2, a=0, rad=0, x=cx, y=cy, ok=false;
    for(var st=0; st<2600; st++){
      x=cx+rad*Math.cos(a)*1.7; y=cy+rad*Math.sin(a);
      var bx={l:x-w/2-6,r:x+w/2+6,t:y-h/2-4,b:y+h/2+4};
      var hit=bx.l<4||bx.r>W-4||bx.t<4||bx.b>H-4;
      if(!hit){ for(var i=0;i<placed.length;i++){ var o=placed[i]; if(bx.l<o.r&&bx.r>o.l&&bx.t<o.b&&bx.b>o.t){ hit=true; break; } } }
      if(!hit){ ok=true; placed.push(bx); break; }
      a+=0.32; rad+=0.9;
    }
    if(!ok){ sp.remove(); return; }
    sp.style.left=x+'px'; sp.style.top=y+'px';
    setTimeout(function(){ sp.style.opacity='1'; }, idx*35);
  });
}

      else sc.a.split(re).forEach(function(part){
        var k=top.indexOf(part);
        if(k>-1){ var m=el('b',null,part); m.style.color=WCPAL[k%WCPAL.length]; m.style.textDecoration='underline'; m.style.textUnderlineOffset='3px'; sp.appendChild(m); }
        else if(part) sp.appendChild(document.createTextNode(part));
      });
      list.appendChild(sp);
    });
  }
  var n=0;
  function refresh(full){
    var jobs=[answers()]; if(full) jobs.push(counts());
    return Promise.all(jobs).catch(function(e){ err.textContent='불러오지 못했습니다 → '+(/Failed to fetch|NetworkError|Load failed/i.test(e.message)?'인터넷 연결 또는 접속 차단':/PGRST205|42P01|404/.test(e.message)?'표(responses)가 없습니다. SQL을 먼저 실행하세요.':e.message)+'  ['+e.message+']'; list.hidden=false; });
  }
  function tick(){ if(closed) return; if(ck.checked) refresh(n++%3===0); timer=setTimeout(tick,5000); }
  sel.addEventListener('change',function(){ paintTalk(); refresh(false); });
  rf.addEventListener('click',function(){ refresh(true); });
  var FS=[22,26,32,40], fi=1; tg.addEventListener('click',function(){ fi=(fi+1)%FS.length; list.style.setProperty('--fs',FS[fi]+'px'); });
  function close(){ closed=true; clearTimeout(timer); ov.remove(); document.removeEventListener('keydown',esc); window.removeEventListener('resize',rs); }
  function esc(e){ if(e.key==='Escape') close(); }
  var rzT=null; function rs(){ clearTimeout(rzT); rzT=setTimeout(function(){ wcDraw(cloud,wcWords(rows)); },250); }
  cl.addEventListener('click',close); nx.addEventListener('click',function(){ close(); go(cur+1); }); document.addEventListener('keydown',esc); window.addEventListener('resize',rs);
  refresh(true); timer=setTimeout(tick,5000);
}
function renderFinish(){
  var box = el('div','finish');
  var sum = el('div','fsum');
  var c = countWritten();
  sum.appendChild(el('div','big', c.items + '개'));
  sum.appendChild(el('div','sub', c.pages + '개 쪽에 작성한 내용이 있습니다.'));
  box.appendChild(sum);

  var p1 = el('p','fp','작성한 활동 답안과 실습 확인을 한 장의 기록지로 저장합니다. 인쇄 창이 열리면 대상(프린터)을 <b>PDF로 저장</b>으로 선택하세요.');
  p1.innerHTML = '작성한 활동 답안과 실습 확인을 한 장의 기록지로 모아 저장합니다. 인쇄 창이 열리면 대상(프린터)을 <b>PDF로 저장</b>으로 선택하세요.';
  box.appendChild(p1);
  var pdf = el('button','bigbtn','활동 기록 PDF로 저장');
  pdf.addEventListener('click', doPdf);
  box.appendChild(pdf);

  box.appendChild(el('hr','fhr'));
  var p2 = el('p','fp');
  p2.innerHTML = '공용 기기를 사용했다면 저장한 뒤 기록을 지워 주세요. 이 브라우저에 저장된 답안·체크가 모두 삭제되고 <b>되돌릴 수 없습니다.</b>';
  box.appendChild(p2);
  var clr = el('button','bigbtn danger','내 기록 지우기');
  clr.addEventListener('click', doClear);
  box.appendChild(clr);

  var note = el('p','fnote', shareOn() ? '작성한 내용은 이 브라우저에 저장됩니다. 보내기를 누른 칸만 전송되었고, 나머지는 다른 기기나 다른 사람에게 보이지 않습니다.' : '작성한 내용은 이 브라우저에만 저장됩니다. 서버로 전송되지 않으며, 다른 기기나 다른 사람에게 보이지 않습니다.');
  box.appendChild(note);
  return box;
}
function INST(){ return DATA.audience==='instructor'; }
function exUI(label, build, oneWay){
  var wrap = document.createElement('div'), nm = label||'예시 답안';
  var btn = el('button','exbtn',nm+' 보기'), box = el('div','exbox'); box.hidden = true;
  build(box);
  btn.addEventListener('click', function(){ if(oneWay){ box.hidden=false; btn.hidden=true; return; } box.hidden = !box.hidden; btn.textContent = nm + (box.hidden ? ' 보기' : ' 닫기'); });
  wrap.appendChild(btn); wrap.appendChild(box); return wrap;
}
function withExample(node,b){
  if(!INST()) return node;
  var ui = null;
  if((b.type==='answer'||b.type==='longtext') && b.ex){ ui = exUI('', function(box){ box.textContent = b.ex; }); }
  else if(b.type==='fields' && b.items.some(function(f){ return f.ex; })){
    ui = exUI('', function(box){ b.items.forEach(function(f,i){ if(!f.ex) return; var d=el('div'); d.appendChild(el('span','exk', f.k+': ')); d.appendChild(document.createTextNode(f.ex)); box.appendChild(d); }); });
  } else if(b.type==='worksheet' && b.ex){
    ui = exUI('', function(box){ var t=document.createElement('table'), th=el('tr'); b.header.forEach(function(h){ th.appendChild(el('th',null,h)); }); t.appendChild(th);
      b.ex.forEach(function(r){ var tr=el('tr'); r.forEach(function(c){ tr.appendChild(el('td',null,c)); }); t.appendChild(tr); }); box.appendChild(t); });
  }
  if(!ui) return node;
  var frag = document.createDocumentFragment(); frag.appendChild(node); frag.appendChild(ui); return frag;
}
function renderBlock(b,p,bi){
  var n = renderBlockRaw(b,p,bi);
  return withExample(n,b);
}
function renderBlockRaw(b,p,bi){
  switch(b.type){
    case 'skip': return el('div');
    case 'table': return renderTable(b);
    case 'checks': return renderChecks(b,p,bi);
    case 'fields': return renderFields(b,p,bi);
    case 'answer': return renderAnswer(b,p,bi);
    case 'quiz': return renderQuiz(b,p,bi);
    case 'share': return el('div');
    case 'reveal': if(!INST()) return el('div'); return exUI(b.label||'정리', function(box){ box.textContent=b.text; }, b.label==='클라우드가 안 될 때');
    case 'read': if(!INST()||!window.speechSynthesis||!window.SpeechSynthesisUtterance) return el('div');
      var rb=el('button','exbtn readbtn','▶ 상황 소리 내어 읽기'), rp=false;
      rb.addEventListener('click', function(){
        if(rp){ speechSynthesis.cancel(); rp=false; rb.textContent='▶ 상황 소리 내어 읽기'; return; }
        speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(b.text); u.lang='ko-KR'; u.rate=0.95;
        u.onend=u.onerror=function(){ rp=false; rb.textContent='▶ 상황 소리 내어 읽기'; };
        rp=true; rb.textContent='■ 읽기 멈춤'; try{ speechSynthesis.speak(u); }catch(e){ rp=false; rb.textContent='▶ 상황 소리 내어 읽기'; }
      });
      return rb;
    case 'finish': return renderFinish();
    case 'figure': var fg=el('div','figs'), fr=el('div','figrow');
      b.imgs.forEach(function(k){ if(!FIGS[k]) return; var im=document.createElement('img'); im.src=FIGS[k]; im.alt=b.cap||'화면 그림';
        im.addEventListener('click',function(){ showLightbox(im.src); }); fr.appendChild(im); });
      fg.appendChild(fr); if(b.cap) fg.appendChild(el('p','figcap','< 그림 > '+b.cap+'  (눌러서 크게 보기)')); return fg;
    case 'worksheet': return renderWorksheet(b,p,bi);
    case 'checklist': return renderChecklist(b,p,bi);
    case 'longtext': return renderLongtext(b,p,bi);
    case 'tip': var t=el('div','tip'); t.appendChild(el('b','','※')); t.appendChild(el('span',null,b.text)); return t;
    case 'goal': var g=el('div','goal'); g.appendChild(el('span','lab', b.label||'목표')); g.appendChild(el('p',null,b.text)); return g;
    case 'qlist': var q=el('div','qlist'); q.appendChild(el('span','lab', b.label||'핵심 질문'));
      var ol=el('ol'); b.items.forEach(function(x){ ol.appendChild(el('li',null,x)); }); q.appendChild(ol); return q;
    case 'prompt': return el('p','prompt', b.text);
    case 'steps': var o=el('ol','steps'); b.items.forEach(function(x){ var li=el('li'); li.appendChild(el('span','bullet')); li.appendChild(el('span',null,x)); o.appendChild(li); }); return o;
    case 'dashs': case 'bodys': var u=el('ul','dash'); b.items.forEach(function(x){ u.appendChild(el('li',null,x)); }); return u;
  }
  return el('div');
}

/* ---------- page render ---------- */
var pageEl = document.getElementById('page');
function go(i){
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  cur = Math.max(0, Math.min(PAGES.length-1, i));
  var p = PAGES[cur];
  state.visited[p.id]=1; state.last=cur; save();
  pageEl.innerHTML='';
  pageEl.className = 'page' + (p.kind==='chasi' ? ' chasi' : '');
  pageEl.appendChild(el('span','eyebrow', p.group));
  pageEl.appendChild(el('h1','ttl', p.title));
  var bl = el('div','blocks');
  var imgMode = ui.mode==='img' && hasSlide(p);
  if(imgMode){
    var fig = el('figure','slidefig'), im = document.createElement('img');
    im.src = 'data:image/jpeg;base64,' + SLIDES[p.slide-1];
    im.alt = p.title + ' 슬라이드';
    fig.appendChild(im); fig.appendChild(el('span','zoomhint','클릭하면 크게 보기'));
    fig.addEventListener('click', function(){ showLightbox(im.src); });
    bl.appendChild(fig);
    if(hasInput(p)) bl.appendChild(el('p','actcue','↓ 아래 칸에 직접 해 보고 작성하세요'));
  }
  p.blocks.forEach(function(b,bi){
    if(imgMode && TEXT_ONLY.indexOf(b.type)>-1) return;
    bl.appendChild(renderBlock(b,p,bi));
  });
  var vb = document.getElementById('viewBtn');
  vb.hidden = !SLIDES.length || !hasSlide(p);
  vb.textContent = ui.mode==='img' ? '글로 보기' : '슬라이드로 보기';
  var sb = renderSendBar(p, cur+1); if(sb) bl.appendChild(sb);
  pageEl.appendChild(bl);
  lockSent(p);

  document.getElementById('count').textContent = (cur+1)+' / '+PAGES.length+'  ·  '+p.group;
  document.getElementById('prevBtn').disabled = cur===0;
  document.getElementById('nextBtn').disabled = cur===PAGES.length-1;
  var seen = Object.keys(state.visited).length;
  document.getElementById('progbar').style.width = Math.round(seen/PAGES.length*100)+'%';
  paintToc();
  var curBtn = tocEl.querySelector('button.cur');
  if(curBtn && window.innerWidth>900) curBtn.scrollIntoView({block:'nearest'});
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}
document.getElementById('prevBtn').addEventListener('click', function(){ go(cur-1); });
document.getElementById('nextBtn').addEventListener('click', function(){ go(cur+1); });
document.addEventListener('keydown', function(e){
  if(e.target.matches('textarea,input')) return;
  if(e.key==='ArrowLeft') go(cur-1);
  if(e.key==='ArrowRight') go(cur+1);
});

/* ---------- record sheet (browser print → "PDF로 저장") ---------- */
function buildPrintDoc(){
  var root = document.getElementById('printdoc');
  root.innerHTML='';
  root.appendChild(el('h1', null, DATA.title + ' · 활동 기록'));
  var now = new Date();
  var stamp = now.getFullYear()+'. '+(now.getMonth()+1)+'. '+now.getDate();
  root.appendChild(el('div','meta', DATA.subtitle + '  |  작성일 ' + stamp));
  var any = false;
  PAGES.forEach(function(p){
    var items = [];
    p.blocks.forEach(function(b,bi){
      if(b.type==='worksheet'){
        for(var r=0;r<b.nrows;r++){
          b.header.forEach(function(h,c){
            var hint=(b.hints[r]&&b.hints[r][c])||'';
            if(hint.indexOf('①')>-1){
              ['①','②'].forEach(function(n,k){
                items.push([h+' '+n, state.fields[p.id+'.w'+bi+'.'+r+'.'+c+'.'+k]||'']);
              });
            } else {
              var lb = b.nrows>1 ? h+' ('+(r+1)+')' : h;
              items.push([lb, state.fields[p.id+'.w'+bi+'.'+r+'.'+c]||'']);
            }
          });
        }
      } else if(b.type==='checklist'){
        var ticked = b.items.filter(function(it,i){ return state.fields[p.id+'.c'+bi+'.'+i]==='Y'; }).length;
        if(ticked){
          var lines = b.items.map(function(it,i){ return (state.fields[p.id+'.c'+bi+'.'+i]==='Y'?'☑ ':'☐ ')+it; });
          items.push(['점검 결과 ('+ticked+'/'+b.items.length+')', lines.join('\n')]);
        }
      } else if(b.type==='checks'){
        var done = b.items.filter(function(it,i){ return state.fields[p.id+'.k'+bi+'.'+i]==='Y'; });
        if(done.length) items.push([(b.label||'실습 확인')+' ('+done.length+'/'+b.items.length+')',
                                    done.map(function(x){ return '☑ '+x; }).join('\n')]);
      } else if(b.type==='fields'){
        b.items.forEach(function(f,i){ items.push([f.k, state.fields[p.id+'.f'+bi+'.'+i]||'']); });
      } else if(b.type==='answer'){
        items.push([b.q, state.fields[p.id+'.a'+bi]||'']);
      } else if(b.type==='quiz'){
        items.push([b.q, state.fields[p.id+'.q'+bi]||'']);
      } else if(b.type==='share'){
      } else if(b.type==='longtext'){
        items.push([b.label||'작성', state.fields[p.id+'.l'+bi]||'']);
      }
    });
    var real = items.filter(function(x){ return String(x[1]).trim(); });
    if(!real.length) return;
    any = true;
    var s = document.createElement('section');
    s.appendChild(el('div','grp', p.group));
    s.appendChild(el('h2', null, p.title));
    real.forEach(function(x){
      var f = el('div','f');
      f.appendChild(el('div','fl', x[0]));
      f.appendChild(el('div','fv', x[1]));
      s.appendChild(f);
    });
    root.appendChild(s);
  });
  if(!any){
    root.appendChild(el('p','empty','아직 작성한 내용이 없습니다. 활동지에 내용을 입력한 뒤 다시 저장해 주세요.'));
  }
  return any;
}
function doPdf(){
  var any = buildPrintDoc();
  if(!any){ toast('작성한 내용이 아직 없습니다.'); return; }
  toast('인쇄 창에서 "대상"을 PDF로 저장으로 선택하세요.');
  setTimeout(function(){ window.print(); }, 450);
}
document.getElementById('endBtn').addEventListener('click', function(){ go(PAGES.length-1); });
document.getElementById('viewBtn').addEventListener('click', function(){
  ui.mode = ui.mode==='img' ? 'text' : 'img';
  try{ localStorage.setItem(UI_KEY, ui.mode); }catch(e){}
  go(cur);
});

/* ---------- clear ---------- */
function toast(msg){
  var t = el('div','toast',msg); document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3200);
}
function doClear(){
  var scrim = el('div','scrim'), m = el('div','modal');
  m.appendChild(el('h3',null,'내 기록을 모두 지울까요?'));
  m.appendChild(el('p',null,'이 브라우저에 저장된 활동 답안과 실습 확인이 모두 삭제되고 되돌릴 수 없습니다. 이미 보낸 답은 클라우드에 남아 있습니다(강사가 초기화합니다). 필요하면 먼저 PDF로 저장하세요.'));
  var row = el('div','row');
  var cancel = el('button','tbtn','취소');
  var pdf = el('button','tbtn','먼저 PDF 저장');
  var ok = el('button','tbtn danger','모두 지우기');
  cancel.onclick = function(){ scrim.remove(); };
  pdf.onclick = function(){ scrim.remove(); doPdf(); };
  ok.onclick = function(){
    wipe(); scrim.remove(); go(cur); toast('기록을 모두 지웠습니다.');
  };
  row.appendChild(cancel); row.appendChild(pdf); row.appendChild(ok);
  m.appendChild(row); scrim.appendChild(m);
  scrim.addEventListener('click', function(e){ if(e.target===scrim) scrim.remove(); });
  document.body.appendChild(scrim);
}

/* ---------- boot ---------- */
document.getElementById('brandTitle').textContent = DATA.title;
if(INST()) document.getElementById('audBadge').hidden = false;
document.getElementById('brandSub').textContent = DATA.subtitle;
if(shareOn()){ document.getElementById('privNote').innerHTML = '작성한 내용은 이 브라우저 안에 저장됩니다. 각 쪽의 <b>보내기</b>를 누른 칸만 전송되고, 나머지는 서버에 남지 않습니다. 마지막 쪽에서 <b>PDF로 저장</b>한 뒤 <b>내 기록 지우기</b>를 누르면 이 기기에는 아무것도 남지 않습니다.'; }
load(); buildToc(); go(state.last||0);
})();
</script>
